services:
  # MySQL Database Service
  mysql:
    image: mysql:8.4
    container_name: project-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: i32ubbiub43i2b324h
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: 9832nriu4b43gb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - project-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Application Service
  api-service:
    build:
      context: ..
      dockerfile: devops-challenge/Dockerfile
    container_name: project-app
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: user
      DB_PASSWORD: 9832nriu4b43gb
      DB_DATABASE: db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - project-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9999/health", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

# Named volumes for data persistence
volumes:
  mysql_data:
    driver: local

# Network definition
networks:
  project-network:
    driver: bridge
