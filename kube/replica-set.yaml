apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: replica-set-nginx
  labels:
    app: nginx
  annotations:
    description: "ReplicaSet for nginx pods"
    owner: "devops-team"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx # must match the label in the pod template
    # matchExpressions:
    #   - key: app
    #     operator: In
    #     values:
    #       - nginx
    #       - apache

  template:
    metadata:
      name: nginx-pod
      labels:
        app: nginx # must match the selector above
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: / # health check endpoint
            port: 80
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 1